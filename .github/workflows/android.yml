name: Android build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APKs (all ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build universal APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/qanis-universal.apk
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f" -release.apk)
            cp "$f" "out/qanis-${base}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: qanis-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QANIS build ${{ github.run_number }}
          body: |
            QANIS Android build from ${{ github.sha }}.
            Universal APK + per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64).
          files: out/*.apk
          draft: false
          prerelease: true
