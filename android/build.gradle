allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 removed Project.buildDir; drive the output paths through layout instead.
rootProject.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir("../../build").get())

subprojects {
    project.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(project.name))
}

subprojects {
    project.evaluationDependsOn(":app")
}

// Third-party plugins (flutter_js, zstandard, ...) compile Java for 11 but their Kotlin
// tasks default to 1.8. Align them so the JVM-target validation cannot fail the build.
subprojects { project ->
    if (project.name == "app") return   // the app module sets Java/Kotlin 17 itself
    tasks.configureEach { task ->
        if (task.hasProperty("kotlinOptions")) {
            try {
                task.kotlinOptions.jvmTarget = "11"
            } catch (ignored) {
                // newer Kotlin plugins expose compilerOptions instead; the
                // validation-mode property already covers those.
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
